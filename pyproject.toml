[project]
name = "drzavni-posao"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "mlflow-skinny>=3.14.0",
    "pydantic>=2.13.4",
    "ruff>=0.15.20",
    "whisperx>=3.8.6",
]

[project.optional-dependencies]
search = [
    "sentence-transformers>=3.4.0",
    "streamlit>=1.42.0",
]
test = [
    "pytest>=8.3.0",
]

[project.scripts]
dp-segment = "drzavni_posao.search.conform.pipeline:main"
dp-build-bm25 = "drzavni_posao.search.indexing.bm25:main"
dp-build-vectors = "drzavni_posao.search.indexing.vector:main"
dp-search = "drzavni_posao.search.retrieval.engine:main"
dp-evaluate = "drzavni_posao.search.evaluation.runner:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["drzavni_posao", "drzavni_posao.*"]

[tool.ruff]
exclude = ["*.ipynb"]

[[tool.uv.index]]
url = "https://pypi-proxy.cloud.databricks.com/simple"
