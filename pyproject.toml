[project]
name = "drzavni-posao"
version = "0.1.0"
description = "Transcription, diarization, and character assignment for Državni posao"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pydantic>=2.13.4",
    "ruff>=0.15.20",
    "scikit-learn>=1.5.0",
]

[project.optional-dependencies]
# Transcription pipeline (notebooks, transcriber/diarizer). whisperx pulls in
# torchcodec, which has no Linux aarch64 wheels — keep it out of the base deps
# so the search/API Docker image can build on arm64.
transcribe = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "mlflow-skinny>=3.14.0",
    "whisperx>=3.8.6",
]
search = [
    # 5.3+ imports torchcodec eagerly and only guards against ImportError/OSError,
    # so a torchcodec that cannot find FFmpeg (RuntimeError) breaks text search.
    "sentence-transformers>=3.4.0,<5.3",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
test = [
    "pytest>=8.3.0",
]
tiktok-eval = [
    "av>=14.0.0",
    "pillow>=11.0.0",
    "yt-dlp[curl-cffi,default]>=2026.8.19",
]

[project.scripts]
dp-segment = "drzavni_posao.search.conform.pipeline:main"
dp-build-bm25 = "drzavni_posao.search.indexing.bm25:main"
dp-build-vectors = "drzavni_posao.search.indexing.vector:main"
dp-search = "drzavni_posao.search.retrieval.engine:main"
dp-evaluate = "drzavni_posao.search.evaluation.runner:main"
dp-tiktok-eval = "drzavni_posao.tiktok_eval.cli:main"
dp-serve = "drzavni_posao.search.api.app:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["drzavni_posao", "drzavni_posao.*"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402", "F401", "F821"]

[[tool.uv.index]]
url = "https://pypi-proxy.cloud.databricks.com/simple"
