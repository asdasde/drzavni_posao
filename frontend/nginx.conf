server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /search {
        proxy_pass http://search:8000;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://search:8000;
    }

    location / {
        try_files $uri /index.html;
    }
}
